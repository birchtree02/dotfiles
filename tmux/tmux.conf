##### Misc. #####
set -g mouse on
### Inherit current directory ###
bind '%' run 'tmux split-window -c "#{pane_current_path}" -e "TMUX_PARENT_PANE_ID=#{pane_id}" -h'
bind '"' run 'tmux split-window -c "#{pane_current_path}" -e "TMUX_PARENT_PANE_ID=#{pane_id}" -v'
bind c run 'tmux new-window -c "#{pane_current_path}" -e "TMUX_PARENT_PANE_ID=#{pane_id}"'
### For 3rd/image.nvim (for benlubas/molten-nvim) ###
set -gq allow-passthrough on
set -g visual-activity off
### Enable OSC 133 prompt tracking so previous-prompt / next-prompt work ###
set -as terminal-features ',*:osc133'
### True-color (24-bit RGB) so catppuccin hex shades render exactly ###
set -as terminal-features ',*:RGB'

##### Smart Pane Switching #####

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="children=(); i=0; pids=( $(ps -o pid=,tty= | grep -iE '#{s|/dev/||:pane_tty}' | awk '\{print $1\}') ); \
while read -r c p; do [[ -n c && c -ne p && p -ne 0 ]] && children[p]+=\" $\{c\}\"; done <<< \"$(ps -Ao pid=,ppid=)\"; \
while (( $\{#pids[@]\} > i )); do pid=$\{pids[i++]\}; pids+=( $\{children[pid]-\} ); done; \
ps -o state=,comm= -p \"$\{pids[@]\}\" | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

##### Keybindings #####
bind-key -T prefix R source "~/.config/tmux/tmux.conf"

### Vim Motions ###
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -Tcopy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle

### Vim Copy-Paste ###
setw -g mode-keys vi
bind [ run-shell -b "~/.config/tmux/copy_mode_with_line_numbers.sh"
bind ] copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
# Jump between shell prompts (requires OSC 133 markers from .zshrc)
bind -T copy-mode-vi K send -X previous-prompt
bind -T copy-mode-vi J send -X next-prompt

# Select the output of the command the cursor is currently within. Anchors on
# the ➜ prompt char: end-of-line first so a cursor sitting on the prompt line
# still matches its own ➜, then search back to that prompt and select from the
# line below it down to the line above the next prompt.
bind -T copy-mode-vi o {
  send -X end-of-line
  send -X search-backward "➜"
  send -X cursor-down
  send -X start-of-line
  send -X begin-selection
  send -X search-forward "➜"
  send -X cursor-up
  send -X end-of-line
}

### Display Popups ###

# Lazygit
bind -T prefix g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
# Notes
bind -T prefix h display-popup \
  -w 80% \
  -h 80% \
  -E "tmux attach -t notes || tmux new-session -t notes"

# Plain Terminal
bind -T prefix t display-popup

# Switch Theme
bind -T prefix T run-shell -b "~/dotfiles/scripts/toggle-theme.sh > /dev/null 2>&1"

##### Plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# keep at bottom:
run '~/.tmux/plugins/tpm/tpm'

##### Status Bar #####
# Palette (including @thm_bg) comes entirely from the flavour files below.
# Default palette, overridden by the generated file below so a fresh checkout
# that hasn't run quick-setup.sh still has colours defined.
source-file ~/.config/tmux/catppuccin-mocha.conf
# Machine-local theme, generated by scripts/apply-state.sh. -q so a missing file
# leaves the defaults above in place instead of erroring.
source-file -q ~/.local/state/dotfiles/tmux-generated.conf

# Two lines: pane info line above the main status line
set -g status 2

# Status bar base style
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Line above main status: current pane path + running/last command.
# @pane_cmd and @pane_cmd_running are set by zsh hooks (see .zshrc) rather than
# derived from pane_current_command, which only sees the outer shell inside PTY
# wrappers like kiro-cli-term. The command shows teal while running and grey
# once it completes. The path and command are clickable (range=user) — clicking
# copies the full (untruncated) value to the clipboard (see MouseDown1Status).
set -g status-format[1] "#[fg=#{@surface1}] #[range=user|path]#(~/.config/tmux/truncate-middle.sh '#{pane_current_path}' 100)#[norange] #[fg=#{?#{==:#{@pane_cmd_running},1},#{@teal},#{@surface1}}]#[range=user|cmd]#{=100:@pane_cmd}#[norange]"

# Click the path or command on the info line to copy the full value.
bind -n MouseDown1Status {
  if -F "#{==:#{mouse_status_range},path}" \
    "run-shell -b \"~/.config/tmux/copy_to_clipboard.sh #{q:pane_current_path}\""
  if -F "#{==:#{mouse_status_range},cmd}" \
    "run-shell -b \"~/.config/tmux/copy_to_clipboard.sh --opt #{q:pane_id} @pane_cmd_raw\""
  if -F "#{&&:#{!=:#{mouse_status_range},path},#{!=:#{mouse_status_range},cmd}}" \
    "select-window -t ="
}

# Pane contents. Set explicitly rather than left as "default" so panes follow
# the flavour: "default" inherits the terminal background, and kitty only
# repaints existing windows' colours over remote control.
# Active and inactive are deliberately the same — the blue active border is the
# focus cue, so inactive panes are not dimmed.
set -g window-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-active-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Pane borders. bg is set as well as fg for the same reason as window-style:
# without it the border row falls through to the terminal background and stays
# dark under the latte flavour.
set -g pane-border-style "fg=#{@surface1},bg=#{@thm_bg}"
set -g pane-active-border-style "fg=#{@blue},bg=#{@thm_bg}"

# No default separators
set -g status-left-length 100
set -g status-right-length 100

# Left side
set -g status-left "#[fg=#{@blue}] #S "

# Right side
set -g status-right "#[fg=#{@teal}]#(pmset -g batt | grep -Eo '[0-9]+%%') #[fg=#{@surface1}]· #[fg=#{@teal}]%a %d %b #[fg=#{@surface1}]· #[fg=#{@teal}]%H:%M "

# Window status format
set -g window-status-format "#[fg=#{@thm_fg}] #I:#(~/.config/tmux/truncate-middle.sh '#W')#{?window_zoomed_flag,*z,} "
set -g window-status-current-format "#[fg=#{@thm_dark},bg=#{@blue},bold] #I:#(~/.config/tmux/truncate-middle.sh '#W')#{?window_zoomed_flag,*z,} #[bg=#{@thm_bg},nobold]"

### Rename windows with current dir ###
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

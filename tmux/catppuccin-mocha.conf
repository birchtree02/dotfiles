set -g @thm_fg "#cdd6f4"
# Explicit base colour rather than "default": inheriting the terminal
# background means the status bar doesn't change with the flavour, because
# kitty only repaints colours on existing windows via remote control.
set -g @thm_bg "#1e1e2e"
set -g @surface0 "#313244"
set -g @surface1 "#45475a"
set -g @teal "#94e2d5"
set -g @blue "#89b4fa"
set -g @mauve "#cba6f7"
# Mauve blended ~45% into the base. Used as the copy-mode selection background,
# which keeps the underlying text's own colours, so full-strength @mauve would
# leave light syntax colours unreadable.
set -g @mauve_dim "#6c5b88"

##### Misc. #####
set -g mouse on
### OSC 52 clipboard (remote yank → local clipboard via terminal) ###
# "external" makes tmux the single OSC 52 emitter: it forwards its own copy-mode
# copies (and load-buffer -w writes) to the terminal, but ignores OSC 52 from
# apps inside it. nvim delegates via `tmux load-buffer -w -` (see nvim options).
set -g set-clipboard external
# Declare that the terminal supports the OSC 52 clipboard write, so tmux derives
# the Ms capability from terminfo and forwards copies outward. NOTE: tmux resolves
# this per client at ATTACH time — if copy stops working after opening another
# session, detach and reattach so the client recomputes its features.
set -as terminal-features ',xterm-kitty:clipboard'
### Inherit current directory ###
bind '%' run 'tmux split-window -c "#{pane_current_path}" -e "TMUX_PARENT_PANE_ID=#{pane_id}" -h'
bind '"' run 'tmux split-window -c "#{pane_current_path}" -e "TMUX_PARENT_PANE_ID=#{pane_id}" -v'
bind c run 'tmux new-window -c "#{pane_current_path}" -e "TMUX_PARENT_PANE_ID=#{pane_id}"'
### For 3rd/image.nvim (for benlubas/molten-nvim) ###
set -gq allow-passthrough all
set -g visual-activity off
# OSC 133 prompt tracking needs nothing here: tmux always parses the sequence, and
# there is no "osc133" terminal-feature (unknown names are accepted, then ignored).
# The markers come from PROMPT in .zshrc.
### True-color (24-bit RGB) so catppuccin hex shades render exactly ###
set -as terminal-features ',*:RGB'

##### Smart Pane Switching #####

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="children=(); i=0; pids=( $(ps -o pid=,tty= | grep -iE '#{s|/dev/||:pane_tty}' | awk '\{print $1\}') ); \
while read -r c p; do [[ -n c && c -ne p && p -ne 0 ]] && children[p]+=\" $\{c\}\"; done <<< \"$(ps -Ao pid=,ppid=)\"; \
while (( $\{#pids[@]\} > i )); do pid=$\{pids[i++]\}; pids+=( $\{children[pid]-\} ); done; \
ps -o state=,comm= -p \"$\{pids[@]\}\" | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

##### Keybindings #####
bind-key -T prefix R source "~/.config/tmux/tmux.conf"

### Vim Motions ###
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -Tcopy-mode-vi 'C-v' send -X begin-selection \; send -X rectangle-toggle

### Vim Copy-Paste ###
setw -g mode-keys vi
# Copy-mode position indicator: show the top line's full timestamp instead of
# the default relative/"pretty" form. Same as the built-in default format but
# with #{t/p:...} (pretty) swapped for a custom strftime via the t/f modifier.
# Literal ':' inside the strftime must be escaped as '#:' so tmux doesn't read
# them as the modifier's variable delimiter (see strftime example in tmux(1)).
# Needs tmux 3.6+; older tmux (e.g. the 3.5a Mac) errors "invalid option" here.
set -g copy-mode-position-format "#[align=right]#{t/f/%Y-%m-%d %H#:%M#:%S:top_line_time}#{?#{e|>:#{top_line_time},0}, ,}[#{scroll_position}/#{history_size}]#{?search_timed_out, (timed out),#{?search_count, (#{search_count}#{?search_count_partial,+,} results),}}"
bind [ run-shell -b "~/.config/tmux/copy_mode_with_line_numbers.sh"
bind ] copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
# Jump between shell prompts (requires OSC 133 markers from .zshrc)
bind -T copy-mode-vi K send -X previous-prompt
bind -T copy-mode-vi J send -X next-prompt

# Select the output of the command the cursor is currently within, using the OSC
# 133 markers rather than searching for ➜ (which mis-fired whenever output itself
# contained a ➜, and on the last command wrapped around to select all history).
# cursor-down first because previous-prompt only ever moves backwards, so without
# it a cursor already on the first output line jumps to the previous command.
bind -T copy-mode-vi o {
  send -X cursor-down
  send -X previous-prompt -o
  send -X start-of-line
  send -X begin-selection
  send -X next-prompt
  send -X cursor-up
  send -X end-of-line
}

# Same as `o` but includes the command itself, not just its output: anchor on the
# output start (previous-prompt -o) then step back one more prompt (previous-prompt)
# to reach the command line. Going via -o first is what makes it work on the last
# command, where a bare previous-prompt would land on the current empty prompt.
bind -T copy-mode-vi O {
  send -X cursor-down
  send -X previous-prompt -o
  send -X previous-prompt
  send -X start-of-line
  send -X begin-selection
  send -X next-prompt
  send -X cursor-up
  send -X end-of-line
}

### Display Popups ###

# Lazygit
bind -T prefix g display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
# Notes
bind -T prefix h display-popup \
  -w 80% \
  -h 80% \
  -E "tmux attach -t notes || tmux new-session -t notes"

# Plain Terminal
bind -T prefix t display-popup

# Switch Theme
bind -T prefix T run-shell -b "~/dotfiles/scripts/toggle-theme.sh > /dev/null 2>&1"

##### Plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Save/restore sessions across restarts, updates and reboots. resurrect writes a
# text snapshot (sessions, windows, panes, layouts, cwds) to disk; continuum runs
# it automatically on a timer and restores on server start.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Options must be set before tpm runs, since the plugins read them as they load.
set -g @continuum-restore 'on'            # rebuild sessions when the server starts
set -g @continuum-save-interval '15'      # minutes between automatic saves
set -g @resurrect-capture-pane-contents 'on'  # also restore visible scrollback
# Relaunch Claude in restored panes. resurrect only re-runs programs on its list,
# so claude must be named explicitly. The `-> claude --continue` inline strategy
# ignores the messy recorded command line (toolbox shim + long --settings blob)
# and reopens the most recent session for the pane's restored cwd.
set -g @resurrect-processes '"~claude->claude --continue"'

# tpm is run at the very bottom of this file, after the status bar is configured:
# tmux-continuum injects its auto-save timer into status-right when it loads, so a
# later `set -g status-right` would wipe it. Loading tpm last preserves the hook.

##### Status Bar #####
# Palette (including @thm_bg) comes entirely from the flavour files below.
# Default palette, overridden by the generated file below so a fresh checkout
# that hasn't run quick-setup.sh still has colours defined.
source-file ~/.config/tmux/catppuccin-mocha.conf
# Machine-local theme, generated by scripts/apply-state.sh. -q so a missing file
# leaves the defaults above in place instead of erroring.
source-file -q ~/.local/state/dotfiles/tmux-generated.conf

# Two lines: pane info line above the main status line
set -g status 2

# Status bar base style
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Line above main status: current pane path + running/last command.
# @pane_cmd and @pane_cmd_running are set by zsh hooks (see .zshrc) rather than
# derived from pane_current_command, which only sees the outer shell inside PTY
# wrappers like kiro-cli-term. The command shows teal while running and grey
# once it completes. The path and command are clickable (range=user) — clicking
# copies the full (untruncated) value to the clipboard (see MouseDown1Status).
set -g status-format[1] "#[fg=#{@surface1}] #[range=user|path]#(~/.config/tmux/truncate-middle.sh '#{pane_current_path}' 100)#[norange] #[fg=#{?#{==:#{@pane_cmd_running},1},#{@teal},#{@surface1}}]#[range=user|cmd]#{=100:@pane_cmd}#[norange]"

# Click the path or command on the info line to copy the full value.
bind -n MouseDown1Status {
  if -F "#{==:#{mouse_status_range},path}" \
    "run-shell -b \"~/.config/tmux/copy_to_clipboard.sh #{q:pane_current_path}\""
  if -F "#{==:#{mouse_status_range},cmd}" \
    "run-shell -b \"~/.config/tmux/copy_to_clipboard.sh --opt #{q:pane_id} @pane_cmd_raw\""
  if -F "#{&&:#{!=:#{mouse_status_range},path},#{!=:#{mouse_status_range},cmd}}" \
    "select-window -t ="
}

# Pane contents. Set explicitly rather than left as "default" so panes follow
# the flavour: "default" inherits the terminal background, and kitty only
# repaints existing windows' colours over remote control.
# Active and inactive are deliberately the same — the blue active border is the
# focus cue, so inactive panes are not dimmed.
set -g window-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-active-style "bg=#{@thm_bg},fg=#{@thm_fg}"

# Pane borders. bg is set as well as fg for the same reason as window-style:
# without it the border row falls through to the terminal background and stays
# dark under the latte flavour.
set -g pane-border-style "fg=#{@surface1},bg=#{@thm_bg}"
set -g pane-active-border-style "fg=#{@blue},bg=#{@thm_bg}"

# No default separators
set -g status-left-length 100
set -g status-right-length 100

# Left side
set -g status-left "#[fg=#{@blue}] #S "

# Right side
set -g status-right "#[fg=#{@teal}]#(pmset -g batt | grep -Eo '[0-9]+%%') #[fg=#{@surface1}]· #[fg=#{@teal}]%a %d %b #[fg=#{@surface1}]· #[fg=#{@teal}]%H:%M "

# Window status format
set -g window-status-format "#[fg=#{@thm_fg}] #I:#(~/.config/tmux/truncate-middle.sh '#W')#{?window_zoomed_flag,*z,} "
set -g window-status-current-format "#[fg=#{@thm_bg},bg=#{@blue},bold] #I:#(~/.config/tmux/truncate-middle.sh '#W')#{?window_zoomed_flag,*z,} #[bg=#{@thm_bg},nobold]"

### Rename windows with current dir ###
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

##### Plugin manager (keep last — see the Plugins section above) #####
run '~/.tmux/plugins/tpm/tpm'
